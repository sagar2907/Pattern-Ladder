[project]
name = "pattern-ladder"
version = "0.1.0"
description = "A DSA study engine: hybrid retrieval, cross-encoder reranking, and problem families discovered from LeetCode's similar-questions graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "bm25s>=0.2.13",
    "pystemmer>=2.2.0",
    "sentence-transformers>=3.0.0",
    # Pinned to the CPU wheel index below. The default PyPI torch pulls the
    # full CUDA stack on Linux (~2.5GB), which alone would exceed the free
    # hosting tier we deploy to. Nothing here ever touches a GPU.
    "torch>=2.2",
    "networkx>=3.3",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=4.2",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_ladder"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
    # Long lines inside docstrings and data tables are deliberate; E501 is
    # handled by the formatter's line-length instead.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately shadow names and use magic values.
"tests/*" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ without requiring an editable install, so `pytest` works
# on a fresh clone and CI has one less step that can fail.
pythonpath = ["src"]
# Offline by default. Any test needing the network must be marked and is
# deselected in CI; the suite must pass with no secrets and no connection.
addopts = "-q -m 'not network'"
markers = [
    "network: requires internet or an API key (excluded from the default run)",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
